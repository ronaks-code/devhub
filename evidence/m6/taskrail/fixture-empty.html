<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>TaskRail empty</title>
<style>html,body{margin:0;height:100%;background:#181818;font-family:-apple-system,system-ui,sans-serif;}:root,
:root[data-theme="dark"] {
  /* Surfaces */
  --bg: #09090b; /* zinc-950 — app background */
  --panel: #18181b; /* zinc-900 — cards/composer */
  --panel-soft: rgba(24, 24, 27, 0.3); /* zinc-900/30 — subtle fills */
  --elevated: #27272a; /* zinc-800 — hover surfaces */

  /* Borders / dividers */
  --border: #27272a; /* zinc-800 */
  --border-soft: rgba(39, 39, 42, 0.8); /* zinc-800/80 */

  /* Text */
  --text: #f4f4f5; /* zinc-100 */
  --text-muted: #a1a1aa; /* zinc-400 */
  --text-dim: #71717a; /* zinc-500 */
  --text-faint: #52525b; /* zinc-600 */

  /* Accent (clay) */
  --accent: #d97757; /* clay-500 */
  --accent-hover: #c25e3f; /* clay-600 */
  --accent-fg: #ffffff; /* text on accent */
  --accent-soft: rgba(217, 119, 87, 0.15); /* clay-500/15 tint */

  /* Status */
  --danger: #f87171; /* red-400 */
  --warning: #fbbf24; /* amber-400 */
  --success: #34d399; /* emerald-400 */

  color-scheme: dark;
}

/*
 * DevHub reference-first design tokens (M6). Transcribed verbatim from
 * `.planning/devhub-codex-parity/design-system.md` §2.1 (dark semantic palette)
 * and §3.1 (wide-reference geometry). These are ADDITIVE and do not mutate the
 * legacy `--bg`/`--panel`/`--accent` tokens above; the brownfield shadcn semantic
 * migration (moving clay to `--brand`, aliasing shadcn `--primary`/`--accent`) is a
 * separate task. The dark reference palette is the fidelity authority; light is a
 * supported theme audited separately in M8, so the colors below stay dark-scoped.
 * Feature components reference `var(--dh-*)`, never raw hex.
 */
:root,
:root[data-theme="dark"] {
  /* Observed shell surfaces */
  --dh-canvas: #181818;
  --dh-header: #181818;
  --dh-rail-inactive: #202020;
  --dh-rail-active: #404040;
  --dh-surface: #2d2d2d;
  --dh-user-bubble: #242424;
  --dh-control: #262626;
  --dh-control-seam: #252525;
  --dh-selected: #313131;

  /* Locked state fallbacks; static captures did not expose all states */
  --dh-hover: #2a2a2a;
  --dh-pressed: #383838;
  --dh-scrim: rgb(0 0 0 / 0.6);

  /* Text */
  --dh-text-strong: #ffffff;
  --dh-text: #dedede;
  --dh-text-muted: #969696;
  --dh-text-disabled: #676767;

  /* Dividers and focus */
  --dh-border-subtle: #2b2b2b;
  --dh-border: #3a3a3a;
  --dh-border-rail: #424242;
  --dh-focus: #8ab4f8;
  --dh-link: #86b9f9;

  /* Status; always pair color with text and/or an icon */
  --dh-success: #4fa66a;
  --dh-warning: #d4a24c;
  --dh-danger: #d95c5c;
  --dh-diff-add: #45a65a;
  --dh-diff-remove: #db5652;

  /* Product brand; never reuse as neutral selection */
  --dh-brand: #d97757;

  /* Provider/elevated-access accents, never provider logos */
  --dh-provider-openai: #6f8f7d;
  --dh-provider-anthropic: #b87356;
  --dh-access-elevated: #d97757;
}

/* Wide-reference geometry constants (design-system.md §3.1). Logical CSS pixels
 * derived from the exact 3600x2260 content rectangle at 2x backing scale. */
:root {
  --dh-window-reference-width: 1800px;
  --dh-window-reference-height: 1130px;
  --dh-rail-width: 273px;
  --dh-rail-collapsed-width: 48px; /* proposed narrow fallback */
  --dh-header-height: 46px;
  --dh-transcript-width: 736px;
  --dh-composer-width: 736px;
  --dh-composer-height: 98px;
  --dh-inspector-width: 300px;
  --dh-inspector-lane-width: 316px;
  --dh-shell-gutter: 16px;
  --dh-composer-bottom: 16px;
  --dh-inspector-top-gutter: 12px;
  --dh-inspector-right-gutter: 16px;

  /* Rail open-list measured constants (reference-capture-manifest.md: "256x30
   * selected row at 8 inset"). Consumed by TaskRail (M6 slice 2). */
  --dh-rail-inset: 8px;
  --dh-selected-row-width: 256px;
  --dh-selected-row-height: 30px;

  /* Radius scale (design-system.md §4.2) — each component owns its semantic radius. */
  --dh-radius-control: 6px;
  --dh-radius-row: 9px;
  --dh-radius-bubble: 12px;
  --dh-radius-dialog: 12px;
  --dh-radius-inspector: 16px;
  --dh-radius-goal: 17px;
  --dh-radius-composer: 21px;
  --dh-radius-pill: 999px;
}

/*
 * DevHubShell frame (M6 slice 1). Locked container/geometry from design-lock §4
 * and design-system.md §3. Geometry reads the tokens above so measured values live
 * in one place. Mounted only behind the default-off `shellChrome` flag.
 */
.dh-shell {
  display: flex;
  flex-direction: row;
  height: 100%;
  min-height: 0;
  overflow: hidden; /* the shell never scrolls horizontally; content owns its own scroll */
  background: var(--dh-canvas);
  color: var(--dh-text);
}

.dh-skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 80;
}
.dh-skip-link:focus {
  left: 12px;
  top: 8px;
  border-radius: var(--dh-radius-control);
  background: var(--dh-brand);
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--dh-text-strong);
  outline: 2px solid var(--dh-focus);
  outline-offset: 2px;
}

.dh-rail {
  width: var(--dh-rail-width);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--dh-rail-active); /* browser/PWA opaque fallback = active window */
  border-right: 1px solid var(--dh-border-rail);
}

.dh-brand {
  height: var(--dh-header-height);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding: 0 var(--dh-shell-gutter);
  font-size: 18px;
  line-height: 22px;
  font-weight: 600;
  color: var(--dh-text-strong);
}

.dh-rail-content {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  padding: var(--dh-space-2, 8px) 0;
}

/*
 * TaskRail — the rail as an OPEN LIST (M6 slice 2). Task rows are flat list items
 * grouped under quiet headings (never nested cards). The selected row is the measured
 * 256x30 fill at an 8-unit inset; its height never changes when a quiet spinner
 * appears. Provider identity is quiet text (never a logo). Mounted only behind the
 * default-off `taskRail` flag.
 */
.dh-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.dh-tasklist-root {
  display: flex;
  flex-direction: column;
  min-height: 0;
  flex: 1 1 0;
  /* Fill the rail-content height so the task list owns the scroll region and the
   * secondary destinations pin to the bottom. `height: 100%` resolves against the
   * rail-content flex item; `.dh-tasklist` then takes the remaining space. */
  height: 100%;
}

.dh-tasklist-actions {
  padding: var(--dh-rail-inset);
}

.dh-newtask {
  width: 100%;
  height: var(--dh-selected-row-height);
  border-radius: var(--dh-radius-row);
  background: var(--dh-control);
  color: var(--dh-text);
  border: 1px solid var(--dh-border-subtle);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
.dh-newtask:hover {
  background: var(--dh-hover);
}
.dh-newtask:focus-visible {
  outline: 2px solid var(--dh-focus);
  outline-offset: 2px;
}

/* Open list: no card chrome on containers — flat rows only. */
.dh-tasklist {
  list-style: none;
  margin: 0;
  padding: 0;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
}
.dh-tasklist-group {
  list-style: none;
}
.dh-tasklist-heading {
  padding: 8px var(--dh-shell-gutter) 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--dh-text-muted);
}
.dh-tasklist-rows {
  list-style: none;
  margin: 0;
  padding: 0;
}
.dh-tasklist-empty {
  list-style: none;
  padding: 8px var(--dh-shell-gutter);
  font-size: 12px;
  color: var(--dh-text-muted);
}

.dh-task-row {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 4px;
  width: var(--dh-selected-row-width);
  height: var(--dh-selected-row-height); /* invariant — spinner never changes height */
  margin: 0 var(--dh-rail-inset);
  border-radius: var(--dh-radius-row);
  color: var(--dh-text-muted);
}
.dh-task-row:hover {
  background: var(--dh-hover);
}
.dh-task-row--selected {
  background: var(--dh-selected); /* #313131 measured selected fill */
  color: var(--dh-text);
}

.dh-task-open {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1 1 0;
  min-width: 0;
  height: 100%;
  padding: 0 8px;
  background: transparent;
  border: 0;
  color: inherit;
  font-size: 12px;
  cursor: pointer;
  text-align: left;
}
.dh-task-open:focus-visible {
  outline: 2px solid var(--dh-focus);
  outline-offset: -2px;
  border-radius: var(--dh-radius-row);
}
.dh-task-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dh-task-provider {
  flex-shrink: 0;
  font-size: 10px;
  color: var(--dh-text-muted); /* quiet provider identity — never a logo */
}
.dh-task-spinner {
  flex-shrink: 0;
  width: 10px;
  height: 10px;
  border-radius: var(--dh-radius-pill);
  border: 1.5px solid var(--dh-text-muted);
  border-top-color: transparent;
  animation: dh-spin 0.8s linear infinite;
}
@media (prefers-reduced-motion: reduce) {
  .dh-task-spinner {
    animation: none;
  }
}
@keyframes dh-spin {
  to {
    transform: rotate(360deg);
  }
}

/* Overflow actions: always laid out (reachable without hover). */
.dh-task-actions {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  margin-right: 4px;
  border-radius: var(--dh-radius-control);
  background: transparent;
  border: 0;
  color: var(--dh-text-muted);
  cursor: pointer;
}
.dh-task-actions:hover {
  background: var(--dh-pressed);
  color: var(--dh-text);
}
.dh-task-actions:focus-visible {
  outline: 2px solid var(--dh-focus);
  outline-offset: 1px;
}

.dh-rail-destinations {
  list-style: none;
  margin: 0;
  padding: var(--dh-rail-inset);
  border-top: 1px solid var(--dh-border-subtle);
  flex-shrink: 0;
}
.dh-rail-dest-item {
  list-style: none;
}
.dh-rail-dest {
  width: 100%;
  height: var(--dh-selected-row-height);
  padding: 0 8px;
  border-radius: var(--dh-radius-row);
  background: transparent;
  border: 0;
  color: var(--dh-text-muted);
  font-size: 12px;
  text-align: left;
  cursor: pointer;
}
.dh-rail-dest:hover {
  background: var(--dh-hover);
  color: var(--dh-text);
}
.dh-rail-dest[aria-current="page"] {
  background: var(--dh-selected);
  color: var(--dh-text);
}
.dh-rail-dest:focus-visible {
  outline: 2px solid var(--dh-focus);
  outline-offset: -2px;
}

.dh-rail{height:100vh;}</style></head>
<body><nav class="dh-rail" aria-label="Primary navigation" data-dh-rail=""><div class="dh-brand" data-dh-brand="">DevHub</div><div class="dh-rail-content"><div class="dh-tasklist-root" data-dh-taskrail=""><div class="dh-tasklist-actions"><button type="button" class="dh-newtask" data-dh-new-task="">New task</button></div><ul role="list" class="dh-tasklist" data-dh-open-list=""><li class="dh-tasklist-empty" data-dh-empty="" role="listitem">No tasks</li></ul><ul role="list" class="dh-rail-destinations" data-dh-destinations=""><li role="listitem" class="dh-rail-dest-item"><button type="button" class="dh-rail-dest" data-dh-destination="" aria-current="page">Home</button></li><li role="listitem" class="dh-rail-dest-item"><button type="button" class="dh-rail-dest" data-dh-destination="">Browse</button></li><li role="listitem" class="dh-rail-dest-item"><button type="button" class="dh-rail-dest" data-dh-destination="">Settings</button></li></ul></div></div></nav></body></html>
