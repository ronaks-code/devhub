<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevHub</title>
    <!-- Resolve the theme BEFORE first paint so token-driven surfaces (and any
         modal that mounts early) never flash the wrong palette. Mirrors
         useTheme's resolution: stored preference first (devhub:theme, legacy
         claude-ui:theme), then the OS scheme, defaulting dark. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("devhub:theme") || localStorage.getItem("claude-ui:theme");
          var theme =
            pref === "light" || pref === "dark"
              ? pref
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* storage unavailable — the no-attr default (dark) applies */
        }
      })();
    </script>
    <!-- Favicon (the Deck mark app icon) — Vite copies public/ verbatim to dist/. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Installable PWA: manifest + theme color (Nebula charcoal) so the app
         installs as a standalone window. The browser fills the title bar / splash
         from these. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#131017" />
    <!-- iOS standalone hints (Android/desktop read these from the manifest). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DevHub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
