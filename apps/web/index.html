<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevHub</title>
    <!-- Favicon (the clay hexagon logo) — Vite copies public/ verbatim to dist/. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Installable PWA: manifest + theme color (clay-500) so the app installs as
         a standalone window. The browser fills the title bar / splash from these. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#d97757" />
    <!-- iOS standalone hints (Android/desktop read these from the manifest). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DevHub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
