[package]
name = "app"
version = "0.1.6"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
libc = "0.2"
# `tray-icon` enables the menu-bar tray API; `image-png` lets us decode the bundled
# PNG app icon for use as the tray image (see src/tray.rs).
tauri = { version = "2.5.0", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2.0.0-rc"
# Global hotkey to summon the window from anywhere (see src/shortcut.rs). 2.x
# tracks the Tauri v2 series this app is on.
tauri-plugin-global-shortcut = "2"
# Native desktop notifications fired when a session finishes a turn (see
# src/notify.rs). 2.x tracks the Tauri v2 series this app is on.
tauri-plugin-notification = "2"
# In-app auto-update: check GitHub Releases, download + install a signed update, and
# relaunch (process plugin). Powers Settings -> "Check for updates".
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
