                      - generic [ref=e3816]: "Base directory for this skill: /Users/ronak/.claude/skills/9-teamupdate # Team Update Turn \"what actually changed across the 6thSense business\" into a short message Ronak can paste straight into the cofounder/teammate group chat. The readers are his teammates, each with LOWER or ZERO context on the internal codebases and limited bandwidth. They need the headline, not the archaeology. Tailor bullets to who's reading — each teammate cares most about their own area: - **James** — GTM / sales. Customer-facing, outbound, deals, anything that unblocks selling. - **Alex** — coding / mocap. Capture pipeline, SDK, tracking/pose, anything he builds on or depends on. - **Matt** — manufacturing / gloves hardware. Glove builds, tactile sensors, physical hardware, calibration. Lead a project's bullet toward whoever owns that area, and call people out by name when something depends on them, unblocks them, or is something they asked for. Everyone sees every bullet, so keep it plain enough that a teammate outside that area still gets it. This is NOT the same as `debrief` (a deep completed-goal report for Ronak) or an hourly internal safety checkpoint. This is short, external, and plain. ## Two modes — figure out which one this is first **Mode A — confirmation.** Ronak says something like \"sent\", \"I sent it\", \"sent that update\", \"marked sent\". Do NOT generate anything. Just: read `state/pending.md` for its window-end timestamp (stored in its own first line), copy that timestamp into `state/last-sent.txt`, delete/clear `state/pending.md`. Confirm briefly. Done. **Mode B — generate.** Anything else (explicit ask, or the nightly schedule firing). Continue below. ## Step 1: find the window Get the real current time first (`date -u +%Y-%m-%dT%H:%M:%SZ`, never assume it). Read `state/last-sent.txt` (ISO8601 timestamp of the end of the last CONFIRMED-sent update). If it doesn't exist, default to 24 hours ago. Check whether `state/pending.md` exists: - If it does, the PREVIOUS generated update was never confirmed sent. This run must cover the FULL span from `last-sent.txt` to now (which includes that unsent night too) and produce ONE merged, still-concise update — re-synthesize from the raw evidence across the whole span, don't just glue the old draft text onto new bullets. If the same project has news in both the old and new part of the span, merge it into a single bullet describing the net change, don't list it twice. - If it doesn't, this is a normal single-window run: since `last-sent.txt` (or the 24h default) to now. ## Step 2: figure out what's actually in scope In scope: anything under `~/Documents/00-6thsense/` (this covers the Hermes/company-platform build clone, capture, nerve-sdk, and any future project added under that folder — don't hardcode a project list, use the folder rule) PLUS the live M1 OpenClaw system it deploys to (reachable via the known M1 SSH path). This is the whole business. Out of scope: anything outside that folder (e.g. DevHub/claude-ui lives elsewhere and is a personal/unrelated tool) — never include it, even if it had a lot of activity. For each in-scope project: - `git log --oneline --since=\"<window start>\" <relevant branches/worktrees>` — the real ledger, not a self-report from any agent. - For the Hermes/company-platform side, also check whether the live M1 actually advanced (a new deployed commit, or a new capability going live there) — that's real business progress and matters more than clone-side commits. - Distill into what actually changed, in plain terms — what a feature/system does now that it didn't before, or what's now fixed/tested/working. Not commit-message jargon. - Note anything relevant to a named teammate (a dependency on them, something that unblocks them, something they asked for). - Skip a project entirely if nothing changed in the window — don't pad with \"no updates\" lines. ## Step 3: write the message Write it the way Ronak actually types in the group chat, not as a formal report. Rules: - **All lowercase, no ending periods.** Don't capitalize the start of bullets, don't end them with a period. Capitals only for real proper nouns (SLAM, IMU, YC, names like Alex/Matt/James). - **No em-dashes, ever.** It's the tell that a bot wrote it (Ronak has literally flagged em-dashes as \"that's gpt\"). Use commas, slashes, or line breaks instead. - **Lead with the concrete result, spec-level when you have it.** \"got 3 cameras at 480p 30hz with no frame drops\" beats \"improved camera capture.\" Use exact numbers (fps, Hz, counts) when they're real. - **Hedge unvalidated numbers, admit what's not done.** If a number isn't proven, say so (\"looks like ~X but haven't confirmed\"). Volunteer honest \"haven't started Y\" / \"still on Z\" lines instead of implying everything's finished. - **Plain outcome statements, no ownership/hype language.** State what's true now that wasn't before. Do NOT use \"shipped,\" \"built,\" \"crushed it,\" etc. The substance carries the weight, not the verb. - **Keep it clean.** Drop the peer-chat profanity, banter, and hype-caps that show up in the raw chat; keep it warm and casual but clean. Emoji-light: 0 or 1, only if genuinely warranted. - **No tables** — group chat apps don't render them. Flat or one-level-nested bullets only. - **No internal codenames/jargon** teammates wouldn't recognize, no commit hashes, no file paths, no internal tool names. - **Minimum words, maximum info.** One line per item wherever possible. - **Order:** what's done first, then in-progress, then blockers/asks-of-teammates last. - Total length fits one phone screen without much scrolling. If long, cut detail, not projects. - Never invent progress or add a claim/number not backed by real evidence from Step 2. - Never expose credentials, security config, or sensitive internal/customer/financial data. ## Step 4: save state + persist + present (generate mode only) 1. Write the message to `state/pending.md`, with the window-end timestamp (the `date` value from Step 1) as the very first line, then the message below it. Do NOT touch `state/last-sent.txt` — that only advances on confirmation (Mode A). If this run combined an old unsent window with a new one, the old `pending.md` is simply overwritten with the new merged version. 2. Persist + present it by running the helper (this handles the dated local archive, gbrain, and the browser view — do NOT open the raw .md in TextEdit anymore): python3 ~/.claude/skills/9-teamupdate/persist_update.py ~/.claude/skills/9-teamupdate/state/pending.md --open The helper is IDEMPOTENT and keyed by the update's DATE (from the first line of `pending.md`). It: - saves a dated local archive file `~/Documents/00-6thsense/team-updates/YYYY-MM-DD-teamupdate.md` (+ rebuilds `index.md`), - writes a gbrain page `team-update/YYYY-MM-DD` (type `team-update`, tags `[team-update, status-update]`) with a per-page timeline entry — re-running the same day overwrites, never duplicates, - renders a clean HTML page and (with `--open`) opens it in the browser instead of TextEdit. If gbrain is unreachable the helper still writes the local archive + HTML and stages the intended gbrain write to `state/gbrain-staged.log`; it never fails the run. Pass `--no-gbrain` to skip the gbrain write, or `--date YYYY-MM-DD` to override the date. Retrieval: Ronak can see every update in day order with `gbrain list --type team-update` (dated slugs sort chronologically), read one with `gbrain get team-update/YYYY-MM-DD`, browse the local archive at `~/Documents/00-6thsense/team-updates/` (open `html/index.html`), or see a single day's timeline with `gbrain timeline team-update/YYYY-MM-DD`. ## Tiny example (shape only, not real content) > - the capture pipeline no longer loses footage if the app crashes mid-write > - Alex: the sdk now reads calibration off the new camera revision, so the mocap side should just work > - Matt: glove data saves crash-safe now, per-device calibration is checksummed > - still blocked on Alex's calibration files to finish the accuracy checks ## Hard rules - This is a report, not new work — don't start building anything from this skill. - Scope is folder-based (`00-6thsense/` + the live M1), not a hardcoded list — a new project under that folder is automatically in scope, nothing outside it ever is. - Timestamps: always get the real current time via `date`, never assume or calculate from memory. --- ## Self-improvement (dream loop) When you finish a task using this skill, if anything caused friction (the user corrected you, an instruction was ambiguous, you had to redo work, or you learned a durable preference), log ONE structured line before ending. This is a passive log, NOT a self-edit. Never modify this skill file. Run (skip silently if `dream-log` is missing): ~/.claude-dream/bin/dream-log --skill \"teamupdate\" --type pitfall --key \"<short-kebab-id>\" --insight \"<one line>\" --confidence 7 --friction \"<what went wrong>\" Types: pattern|pitfall|preference|architecture|tool|operational. Same --key = same recurring issue (nightly dedups on it). Log at most 1-2 lines per task; no friction, no log."
